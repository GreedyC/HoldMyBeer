[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holdmybeer"
version = "0.1.0"
description = "Teach and check browser workflows by demonstration"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "playwright>=1.42,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["holdmybeer"]
